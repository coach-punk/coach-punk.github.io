site: My Vast, Right-Wing Conspiracy
url: https://coach-punk.github.io #yoururl
title: [MVRWC]
description: Simple and minimalistic conspiracy theorist.
twitter:
  username: @2oft #yourusername
  card: summary
  creator: John #yourusername
author:
  twitter: @2oft #yourusername
  name: #yourusername
  avatar:
  email: #youremail
  url: #yoururl
permalink: pretty
paginate: 5
baseurl: ""

highlighter: none

exclude:
  - .jekyll-cache

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir:          _sass
  style:            :compressed

theme: null
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-archives
  - jekyll-tagging
  - jekyll-paginate-v2

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:year/:month/:day/:slug

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"